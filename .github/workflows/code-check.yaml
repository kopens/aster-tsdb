name: Ant Check

on:
    push:
        branches:
            - '**'

jobs:
    # Aster fork: this build targets Java 21 only (CI image eclipse-temurin:21-jdk) and fork code uses
    # post-11 APIs, so upstream's jdk11/jdk17 jobs are replaced by a single jdk21 one.
    ant-check-jdk21:
        runs-on: ubuntu-latest

        steps:
          - name: Checkout code
            uses: actions/checkout@v4
          - name: JDK 21
            uses: actions/setup-java@v4
            with:
              java-version: '21'
              distribution: 'temurin'
          - name: Run Code Checks
            # --summary exercises run_ant's summary path against real ant output
            run: .build/docker/check-code.sh 21 --summary
