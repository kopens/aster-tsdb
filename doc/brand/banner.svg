<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Aster TSDB - Aster Timeseries Database">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#090B10"/>
      <stop offset="0.55" stop-color="#0E1119"/>
      <stop offset="1" stop-color="#141826"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8B7CF6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="petalA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#7C6CF0"/>
    </linearGradient>
    <linearGradient id="petalB" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7DA2F5"/>
      <stop offset="1" stop-color="#4F73D8"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0"   stop-color="#8B7CF6" stop-opacity="0.10"/>
      <stop offset="1"   stop-color="#9DB6FF" stop-opacity="0.85"/>
    </linearGradient>
    <linearGradient id="rule" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#A78BFA"/>
      <stop offset="1" stop-color="#5B8DEF"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <circle cx="148" cy="160" r="215" fill="url(#glow)"/>

  <!-- the series lives in the right third only, so it never crowds the wordmark -->
  <g transform="translate(0 6)">
    <g opacity="0.20" fill="#7E93BC">
      <rect x="860" y="201" width="20" height="75" rx="2.5"/>
      <rect x="892" y="184" width="20" height="92" rx="2.5"/>
      <rect x="924" y="219" width="20" height="57" rx="2.5"/>
      <rect x="956" y="190" width="20" height="86" rx="2.5"/>
      <rect x="988" y="168" width="20" height="108" rx="2.5"/>
      <rect x="1020" y="208" width="20" height="68" rx="2.5"/>
      <rect x="1052" y="245" width="20" height="31" rx="2.5"/>
      <rect x="1084" y="197" width="20" height="79" rx="2.5"/>
      <rect x="1116" y="176" width="20" height="100" rx="2.5"/>
      <rect x="1148" y="186" width="20" height="90" rx="2.5"/>
    </g>
    <path d="M870 201 L902 184 L934 219 L966 190 L998 168 L1030 208 L1062 245 L1094 197 L1126 176 L1158 186"
          fill="none" stroke="url(#spark)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="1158" cy="186" r="4.5" fill="#C9D8FF"/>
  </g>

  <!-- the aster: two rings of narrow ray florets around a disc -->
  <g transform="translate(148 160)">
    <g fill="url(#petalB)" opacity="0.80">
      <g transform="rotate(22.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(67.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(112.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(157.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(202.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(247.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(292.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
      <g transform="rotate(337.5)"><ellipse cx="0" cy="-36" rx="5.5" ry="26"/></g>
    </g>
    <g fill="url(#petalA)">
      <g><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(45)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(90)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(135)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(180)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(225)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(270)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
      <g transform="rotate(315)"><ellipse cx="0" cy="-46" rx="6.5" ry="34"/></g>
    </g>
    <circle cx="0" cy="0" r="15" fill="#090B10"/>
    <circle cx="0" cy="0" r="9.5" fill="#EDE9FE"/>
    <circle cx="0" cy="0" r="4"  fill="#7C6CF0"/>
  </g>

  <g font-family="DejaVu Sans">
    <text x="292" y="136" font-size="56" font-weight="bold" fill="#F5F7FB" letter-spacing="-1.6">Aster TSDB</text>
    <rect x="294" y="160" width="62" height="3" rx="1.5" fill="url(#rule)"/>
    <text x="294" y="196" font-size="20" fill="#C3CBDA">Aster Timeseries Database</text>
    <text x="294" y="226" font-size="15" fill="#767F92">A drop-in Apache Cassandra 6.0 with industrial time-series built in</text>
  </g>
</svg>
